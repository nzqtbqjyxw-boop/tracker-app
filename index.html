<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f0f14);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8b8b95);
    --button: var(--tg-theme-button-color, #5b8def);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #1a1a22);
    --accent-green: #4ade80;
    --accent-red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    padding: 16px;
    padding-bottom: 90px;
    min-height: 100vh;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--hint); font-size: 13px; margin-bottom: 20px; }

  .tabs {
    display: flex;
    background: var(--secondary-bg);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    color: var(--hint);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active { background: var(--button); color: var(--button-text); }

  .view { display: none; }
  .view.active { display: block; }

  .card {
    background: var(--secondary-bg);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }

  /* Habits */
  .habit-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .habit-item:last-child { border-bottom: none; }
  .habit-info { display: flex; align-items: center; gap: 12px; }
  .habit-icon { font-size: 22px; }
  .habit-name { font-weight: 600; font-size: 15px; }
  .habit-streak { color: var(--hint); font-size: 12px; margin-top: 2px; }
  .check-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2px solid var(--hint);
    background: transparent;
    color: transparent;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .check-btn.done {
    background: var(--accent-green);
    border-color: var(--accent-green);
    color: #0f0f14;
  }

  .add-btn {
    width: 100%;
    padding: 14px;
    background: var(--button);
    color: var(--button-text);
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 8px;
    cursor: pointer;
  }

  /* Finance */
  .balance-card { text-align: center; padding: 24px 16px; }
  .balance-label { color: var(--hint); font-size: 13px; }
  .balance-amount { font-size: 32px; font-weight: 800; margin: 4px 0 12px; }
  .balance-row { display: flex; gap: 8px; justify-content: center; font-size: 13px; }
  .balance-in { color: var(--accent-green); }
  .balance-out { color: var(--accent-red); }

  .tx-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .tx-item:last-child { border-bottom: none; }
  .tx-cat { font-weight: 600; font-size: 14px; }
  .tx-date { color: var(--hint); font-size: 12px; }
  .tx-amount { font-weight: 700; font-size: 15px; }
  .tx-amount.in { color: var(--accent-green); }
  .tx-amount.out { color: var(--accent-red); }

  .fab-row { display: flex; gap: 8px; margin-top: 8px; }
  .fab {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .fab.income { background: rgba(74,222,128,0.15); color: var(--accent-green); }
  .fab.expense { background: rgba(248,113,113,0.15); color: var(--accent-red); }

  .empty { text-align: center; color: var(--hint); padding: 30px 0; font-size: 14px; }

  /* Modal */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: flex-end;
    z-index: 100;
  }
  .overlay.active { display: flex; }
  .modal {
    background: var(--secondary-bg);
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h3 { margin-bottom: 14px; font-size: 17px; }
  .modal input, .modal select {
    width: 100%;
    padding: 12px;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 10px;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 6px; }
  .modal-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-cancel { background: transparent; color: var(--hint); border: 1px solid rgba(255,255,255,0.1) !important; }
  .btn-save { background: var(--button); color: var(--button-text); }

  .emoji-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .emoji-opt {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    border-radius: 10px;
    font-size: 20px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .emoji-opt.selected { border-color: var(--button); }
</style>
</head>
<body>

<h1>Мой трекер</h1>
<div class="subtitle">Привычки и финансы в одном месте</div>

<div class="tabs">
  <div class="tab active" data-view="habits">Привычки</div>
  <div class="tab" data-view="finance">Финансы</div>
</div>

<!-- HABITS VIEW -->
<div class="view active" id="habits">
  <div class="card" id="habitsList">
    <div class="empty">Пока нет привычек — добавь первую</div>
  </div>
  <button class="add-btn" onclick="openHabitModal()">+ Добавить привычку</button>
</div>

<!-- FINANCE VIEW -->
<div class="view" id="finance">
  <div class="card balance-card">
    <div class="balance-label">Баланс за месяц</div>
    <div class="balance-amount" id="balanceAmount">0 ₽</div>
    <div class="balance-row">
      <span class="balance-in" id="totalIncome">+0 ₽</span>
      <span style="color:var(--hint)">·</span>
      <span class="balance-out" id="totalExpense">-0 ₽</span>
    </div>
  </div>

  <div class="fab-row">
    <button class="fab income" onclick="openTxModal('income')">+ Доход</button>
    <button class="fab expense" onclick="openTxModal('expense')">− Расход</button>
  </div>

  <div class="card" style="margin-top:12px" id="txList">
    <div class="empty">Пока нет операций</div>
  </div>
</div>

<!-- HABIT MODAL -->
<div class="overlay" id="habitOverlay">
  <div class="modal">
    <h3>Новая привычка</h3>
    <div class="emoji-picker" id="emojiPicker"></div>
    <input type="text" id="habitNameInput" placeholder="Название привычки">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('habitOverlay')">Отмена</button>
      <button class="btn-save" onclick="saveHabit()">Сохранить</button>
    </div>
  </div>
</div>

<!-- TX MODAL -->
<div class="overlay" id="txOverlay">
  <div class="modal">
    <h3 id="txModalTitle">Новая операция</h3>
    <input type="number" id="txAmountInput" placeholder="Сумма, ₽" inputmode="numeric">
    <input type="text" id="txCatInput" placeholder="Категория (напр. Еда, Такси)">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('txOverlay')">Отмена</button>
      <button class="btn-save" onclick="saveTx()">Сохранить</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ---------- Storage helpers (Telegram CloudStorage with localStorage fallback) ----------
function storageGet(key) {
  return new Promise((resolve) => {
    if (tg?.CloudStorage) {
      tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value));
    } else {
      resolve(localStorage.getItem(key));
    }
  });
}
function storageSet(key, value) {
  return new Promise((resolve) => {
    if (tg?.CloudStorage) {
      tg.CloudStorage.setItem(key, value, () => resolve());
    } else {
      localStorage.setItem(key, value);
      resolve();
    }
  });
}

let habits = [];
let transactions = [];
let selectedEmoji = '✅';

const EMOJIS = ['✅','💧','🏃','📖','🧘','💤','🚭','🥗','💊','✍️'];

// ---------- Init ----------
async function init() {
  const h = await storageGet('habits');
  const t = await storageGet('transactions');
  habits = h ? JSON.parse(h) : [];
  transactions = t ? JSON.parse(t) : [];
  renderHabits();
  renderFinance();
}
init();

// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.view).classList.add('active');
  });
});

// ---------- Habits ----------
function todayKey() {
  return new Date().toISOString().slice(0,10);
}

function calcStreak(habit) {
  let streak = 0;
  let d = new Date();
  while (true) {
    const key = d.toISOString().slice(0,10);
    if (habit.log[key]) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return streak;
}

function renderHabits() {
  const list = document.getElementById('habitsList');
  if (habits.length === 0) {
    list.innerHTML = '<div class="empty">Пока нет привычек — добавь первую</div>';
    return;
  }
  const today = todayKey();
  list.innerHTML = habits.map((h, i) => `
    <div class="habit-item">
      <div class="habit-info">
        <div class="habit-icon">${h.icon}</div>
        <div>
          <div class="habit-name">${h.name}</div>
          <div class="habit-streak">🔥 ${calcStreak(h)} дн. подряд</div>
        </div>
      </div>
      <button class="check-btn ${h.log[today] ? 'done' : ''}" onclick="toggleHabit(${i})">✓</button>
    </div>
  `).join('');
}

function toggleHabit(index) {
  const today = todayKey();
  const h = habits[index];
  h.log[today] = !h.log[today];
  if (!h.log[today]) delete h.log[today];
  storageSet('habits', JSON.stringify(habits));
  renderHabits();
  tg?.HapticFeedback?.impactOccurred('light');
}

function openHabitModal() {
  const picker = document.getElementById('emojiPicker');
  selectedEmoji = EMOJIS[0];
  picker.innerHTML = EMOJIS.map(e => `<div class="emoji-opt ${e===selectedEmoji?'selected':''}" onclick="pickEmoji('${e}')">${e}</div>`).join('');
  document.getElementById('habitNameInput').value = '';
  document.getElementById('habitOverlay').classList.add('active');
}

function pickEmoji(e) {
  selectedEmoji = e;
  document.querySelectorAll('.emoji-opt').forEach(el => el.classList.toggle('selected', el.textContent === e));
}

function saveHabit() {
  const name = document.getElementById('habitNameInput').value.trim();
  if (!name) return;
  habits.push({ name, icon: selectedEmoji, log: {} });
  storageSet('habits', JSON.stringify(habits));
  renderHabits();
  closeModal('habitOverlay');
}

// ---------- Finance ----------
let currentTxType = 'income';

function openTxModal(type) {
  currentTxType = type;
  document.getElementById('txModalTitle').textContent = type === 'income' ? 'Новый доход' : 'Новый расход';
  document.getElementById('txAmountInput').value = '';
  document.getElementById('txCatInput').value = '';
  document.getElementById('txOverlay').classList.add('active');
}

function saveTx() {
  const amount = parseFloat(document.getElementById('txAmountInput').value);
  const cat = document.getElementById('txCatInput').value.trim() || (currentTxType === 'income' ? 'Доход' : 'Расход');
  if (!amount || amount <= 0) return;
  transactions.unshift({
    type: currentTxType,
    amount,
    category: cat,
    date: new Date().toISOString()
  });
  storageSet('transactions', JSON.stringify(transactions));
  renderFinance();
  closeModal('txOverlay');
}

function renderFinance() {
  const income = transactions.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
  const expense = transactions.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
  document.getElementById('balanceAmount').textContent = formatMoney(income - expense);
  document.getElementById('totalIncome').textContent = '+' + formatMoney(income);
  document.getElementById('totalExpense').textContent = '-' + formatMoney(expense);

  const list = document.getElementById('txList');
  if (transactions.length === 0) {
    list.innerHTML = '<div class="empty">Пока нет операций</div>';
    return;
  }
  list.innerHTML = transactions.slice(0, 30).map(t => `
    <div class="tx-item">
      <div>
        <div class="tx-cat">${t.category}</div>
        <div class="tx-date">${formatDate(t.date)}</div>
      </div>
      <div class="tx-amount ${t.type === 'income' ? 'in' : 'out'}">${t.type === 'income' ? '+' : '-'}${formatMoney(t.amount)}</div>
    </div>
  `).join('');
}

function formatMoney(n) {
  return Math.round(n).toLocaleString('ru-RU') + ' ₽';
}
function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

// ---------- Modal helpers ----------
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', (e) => { if (e.target === o) o.classList.remove('active'); });
});
</script>
</body>
</html>
