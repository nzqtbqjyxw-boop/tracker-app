<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #0f0f14);
  --text: var(--tg-theme-text-color, #ffffff);
  --hint: var(--tg-theme-hint-color, #8b8b95);
  --button: var(--tg-theme-button-color, #5b8def);
  --button-text: var(--tg-theme-button-text-color, #ffffff);
  --secondary-bg: var(--tg-theme-secondary-bg-color, #1a1a22);
  --accent-green: #4ade80;
  --accent-red: #f87171;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; padding: 16px; padding-bottom: 90px; min-height: 100vh; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.subtitle { color: var(--hint); font-size: 13px; margin-bottom: 20px; }
.tabs { display: flex; background: var(--secondary-bg); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
.tab { flex: 1; text-align: center; padding: 10px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--hint); cursor: pointer; transition: all 0.2s; }
.tab.active { background: var(--button); color: var(--button-text); }
.view { display: none; }
.view.active { display: block; }
.card { background: var(--secondary-bg); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
/* Habits */
.habit-item { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.habit-item:last-child { border-bottom: none; }
.habit-top { display: flex; align-items: center; justify-content: space-between; }
.habit-info { display: flex; align-items: center; gap: 12px; }
.habit-icon { font-size: 22px; }
.habit-name { font-weight: 600; font-size: 15px; }
.habit-streak { color: var(--hint); font-size: 12px; margin-top: 2px; }
.habit-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn { background: transparent; border: none; color: var(--hint); font-size: 16px; cursor: pointer; padding: 4px; }
.check-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--hint); background: transparent; color: transparent; font-size: 16px; cursor: pointer; transition: all 0.2s; }
.check-btn.done { background: var(--accent-green); border-color: var(--accent-green); color: #0f0f14; }
.week-grid { display: flex; gap: 6px; margin-top: 10px; }
.week-day { flex: 1; text-align: center; }
.week-day-label { font-size: 10px; color: var(--hint); margin-bottom: 4px; }
.week-day-dot { width: 100%; aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }
.week-day-dot.done { background: var(--accent-green); color: #0f0f14; }
.week-day-dot.today { border: 1.5px solid var(--button); }
.add-btn { width: 100%; padding: 14px; background: var(--button); color: var(--button-text); border: none; border-radius: 12px; font-size: 15px; font-weight: 600; margin-top: 8px; cursor: pointer; }
/* Finance */
.balance-card { text-align: center; padding: 24px 16px; }
.balance-label { color: var(--hint); font-size: 13px; }
.balance-amount { font-size: 32px; font-weight: 800; margin: 4px 0 12px; }
.balance-row { display: flex; gap: 8px; justify-content: center; font-size: 13px; }
.balance-in { color: var(--accent-green); }
.balance-out { color: var(--accent-red); }
.month-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 12px; }
.month-nav button { background: var(--secondary-bg); border: none; color: var(--text); width: 32px; height: 32px; border-radius: 8px; font-size: 16px; cursor: pointer; }
.month-nav span { font-size: 14px; font-weight: 600; min-width: 130px; text-align: center; }
.tx-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); gap: 8px; }
.tx-item:last-child { border-bottom: none; }
.tx-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.tx-icon { font-size: 20px; width: 28px; text-align: center; }
.tx-cat { font-weight: 600; font-size: 14px; }
.tx-date { color: var(--hint); font-size: 12px; }
.tx-amount { font-weight: 700; font-size: 15px; white-space: nowrap; }
.tx-amount.in { color: var(--accent-green); }
.tx-amount.out { color: var(--accent-red); }
.fab-row { display: flex; gap: 8px; margin-top: 8px; }
.fab { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
.fab.income { background: rgba(74,222,128,0.15); color: var(--accent-green); }
.fab.expense { background: rgba(248,113,113,0.15); color: var(--accent-red); }
.empty { text-align: center; color: var(--hint); padding: 30px 0; font-size: 14px; }
.section-title { font-size: 13px; color: var(--hint); font-weight: 600; margin: 4px 0 8px; }
.cat-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.cat-bar-bg { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.06); overflow: hidden; }
.cat-bar-fill { height: 100%; background: var(--button); }
.cat-pct { font-size: 12px; color: var(--hint); width: 34px; text-align: right; }
/* Modal */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: flex-end; z-index: 100; }
.overlay.active { display: flex; }
.modal { background: var(--secondary-bg); width: 100%; border-radius: 20px 20px 0 0; padding: 20px; animation: slideUp 0.25s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h3 { margin-bottom: 14px; font-size: 17px; }
.modal input, .modal select { width: 100%; padding: 12px; background: var(--bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--text); font-size: 15px; margin-bottom: 10px; }
.modal-actions { display: flex; gap: 8px; margin-top: 6px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn-cancel { background: transparent; color: var(--hint); border: 1px solid rgba(255,255,255,0.1) !important; }
.btn-save { background: var(--button); color: var(--button-text); }
.btn-delete { background: rgba(248,113,113,0.15); color: var(--accent-red); }
.emoji-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.emoji-opt { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 10px; font-size: 20px; cursor: pointer; border: 2px solid transparent; }
.emoji-opt.selected { border-color: var(--button); }
.cat-chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.cat-chip { padding: 8px 12px; background: var(--bg); border-radius: 20px; font-size: 13px; cursor: pointer; border: 2px solid transparent; display: flex; align-items: center; gap: 6px; }
.cat-chip.selected { border-color: var(--button); }
</style>
</head>
<body>

<h1>Мой трекер</h1>
<div class="subtitle">Привычки и финансы в одном месте</div>

<div class="tabs">
  <div class="tab active" data-view="habits">Привычки</div>
  <div class="tab" data-view="finance">Финансы</div>
</div>

<!-- HABITS VIEW -->
<div class="view active" id="habits">
  <div class="card" id="habitsList"><div class="empty">Пока нет привычек — добавь первую</div></div>
  <button class="add-btn" id="addHabitBtn">+ Добавить привычку</button>
</div>

<!-- FINANCE VIEW -->
<div class="view" id="finance">
  <div class="month-nav">
    <button id="prevMonthBtn">‹</button>
    <span id="monthLabel"></span>
    <button id="nextMonthBtn">›</button>
  </div>

  <div class="card balance-card">
    <div class="balance-label">Баланс за месяц</div>
    <div class="balance-amount" id="balanceAmount">0 ₽</div>
    <div class="balance-row">
      <span class="balance-in" id="totalIncome">+0 ₽</span>
      <span style="color:var(--hint)">·</span>
      <span class="balance-out" id="totalExpense">-0 ₽</span>
    </div>
  </div>

  <div class="fab-row">
    <button class="fab income" id="addIncomeBtn">+ Доход</button>
    <button class="fab expense" id="addExpenseBtn">− Расход</button>
  </div>

  <div class="card" style="margin-top:12px" id="catBreakdownCard" style="display:none">
    <div class="section-title">Расходы по категориям</div>
    <div id="catBreakdown"></div>
  </div>

  <div class="card" style="margin-top:12px" id="txList"><div class="empty">Пока нет операций</div></div>
</div>

<!-- HABIT MODAL -->
<div class="overlay" id="habitOverlay">
  <div class="modal">
    <h3 id="habitModalTitle">Новая привычка</h3>
    <div class="emoji-picker" id="emojiPicker"></div>
    <input type="text" id="habitNameInput" placeholder="Название привычки" maxlength="40">
    <div class="modal-actions">
      <button class="btn-cancel" id="habitCancelBtn">Отмена</button>
      <button class="btn-save" id="habitSaveBtn">Сохранить</button>
    </div>
    <div class="modal-actions" id="habitDeleteRow" style="display:none; margin-top:6px;">
      <button class="btn-delete" id="habitDeleteBtn">Удалить привычку</button>
    </div>
  </div>
</div>

<!-- TX MODAL -->
<div class="overlay" id="txOverlay">
  <div class="modal">
    <h3 id="txModalTitle">Новая операция</h3>
    <input type="number" id="txAmountInput" placeholder="Сумма, ₽" inputmode="numeric">
    <div class="cat-chip-row" id="txCatChips"></div>
    <input type="text" id="txCatInput" placeholder="Своя категория" maxlength="30">
    <div class="modal-actions">
      <button class="btn-cancel" id="txCancelBtn">Отмена</button>
      <button class="btn-save" id="txSaveBtn">Сохранить</button>
    </div>
    <div class="modal-actions" id="txDeleteRow" style="display:none; margin-top:6px;">
      <button class="btn-delete" id="txDeleteBtn">Удалить операцию</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ---------- Storage helpers ----------
function storageGet(key) {
  return new Promise((resolve) => {
    if (tg?.CloudStorage) tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value));
    else resolve(localStorage.getItem(key));
  });
}
function storageSet(key, value) {
  return new Promise((resolve) => {
    if (tg?.CloudStorage) tg.CloudStorage.setItem(key, value, () => resolve());
    else { localStorage.setItem(key, value); resolve(); }
  });
}

// ---------- XSS-safe render helper ----------
function esc(str) {
  const d = document.createElement('div');
  d.textContent = String(str ?? '');
  return d.innerHTML;
}

let habits = [];
let transactions = [];
let selectedEmoji = '✅';
let editingHabitIndex = null;
let editingTxIndex = null;
let currentTxType = 'income';
let selectedCat = null;
let viewMonth = new Date().getMonth();
let viewYear = new Date().getFullYear();

const EMOJIS = ['✅','💧','🏃','📖','🧘','💤','🚭','🥗','💊','✍','🎯','💻'];
const CATEGORIES = {
  expense: [{n:'Еда',i:'🍔'},{n:'Такси',i:'🚕'},{n:'Жильё',i:'🏠'},{n:'Развлечения',i:'🎮'},{n:'Здоровье',i:'💊'},{n:'Покупки',i:'🛍'},{n:'Другое',i:'📦'}],
  income: [{n:'Зарплата',i:'💼'},{n:'Фриланс',i:'💻'},{n:'Подарок',i:'🎁'},{n:'Другое',i:'📦'}]
};

async function init() {
  const h = await storageGet('habits');
  const t = await storageGet('transactions');
  habits = h ? JSON.parse(h) : [];
  transactions = t ? JSON.parse(t) : [];
  renderHabits();
  renderFinance();
}
init();

// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.view).classList.add('active');
  });
});

// ---------- Habits ----------
function dateKey(d) { return d.toISOString().slice(0,10); }
function todayKey() { return dateKey(new Date()); }

function calcStreak(habit) {
  let streak = 0;
  let d = new Date();
  while (habit.log[dateKey(d)]) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}

function last7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  return days;
}

function renderHabits() {
  const list = document.getElementById('habitsList');
  if (habits.length === 0) {
    list.innerHTML = '<div class="empty">Пока нет привычек — добавь первую</div>';
    return;
  }
  const today = todayKey();
  const week = last7Days();
  const weekLabels = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  list.innerHTML = habits.map((h, i) => `
    <div class="habit-item">
      <div class="habit-top">
        <div class="habit-info">
          <div class="habit-icon">${esc(h.icon)}</div>
          <div>
            <div class="habit-name">${esc(h.name)}</div>
            <div class="habit-streak">🔥 ${calcStreak(h)} дн. подряд</div>
          </div>
        </div>
        <div class="habit-actions">
          <button class="icon-btn" data-edit-habit="${i}">✎</button>
          <button class="check-btn ${h.log[today] ? 'done' : ''}" data-toggle-habit="${i}">✓</button>
        </div>
      </div>
      <div class="week-grid">
        ${week.map(d => {
          const key = dateKey(d);
          const done = !!h.log[key];
          const isToday = key === today;
          return `<div class="week-day">
            <div class="week-day-label">${weekLabels[(d.getDay()+6)%7]}</div>
            <div class="week-day-dot ${done?'done':''} ${isToday?'today':''}" data-toggle-day="${i}" data-day-key="${key}">${done?'✓':''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `).join('');
}

function toggleHabitDay(index, key) {
  const h = habits[index];
  if (h.log[key]) delete h.log[key]; else h.log[key] = true;
  storageSet('habits', JSON.stringify(habits));
  renderHabits();
  tg?.HapticFeedback?.impactOccurred('light');
}

document.getElementById('habitsList').addEventListener('click', (e) => {
  const toggle = e.target.closest('[data-toggle-habit]');
  const toggleDay = e.target.closest('[data-toggle-day]');
  const edit = e.target.closest('[data-edit-habit]');
  if (toggle) toggleHabitDay(+toggle.dataset.toggleHabit, todayKey());
  else if (toggleDay) toggleHabitDay(+toggleDay.dataset.toggleDay, toggleDay.dataset.dayKey);
  else if (edit) openHabitModal(+edit.dataset.editHabit);
});

function openHabitModal(index = null) {
  editingHabitIndex = index;
  const picker = document.getElementById('emojiPicker');
  const isEdit = index !== null;
  selectedEmoji = isEdit ? habits[index].icon : EMOJIS[0];
  picker.innerHTML = EMOJIS.map(e => `<div class="emoji-opt ${e===selectedEmoji?'selected':''}" data-emoji="${e}">${e}</div>`).join('');
  document.getElementById('habitNameInput').value = isEdit ? habits[index].name : '';
  document.getElementById('habitModalTitle').textContent = isEdit ? 'Изменить привычку' : 'Новая привычка';
  document.getElementById('habitDeleteRow').style.display = isEdit ? 'flex' : 'none';
  document.getElementById('habitOverlay').classList.add('active');
}
document.getElementById('addHabitBtn').addEventListener('click', () => openHabitModal());
document.getElementById('emojiPicker').addEventListener('click', (e) => {
  const opt = e.target.closest('[data-emoji]');
  if (!opt) return;
  selectedEmoji = opt.dataset.emoji;
  document.querySelectorAll('#emojiPicker .emoji-opt').forEach(el => el.classList.toggle('selected', el.dataset.emoji === selectedEmoji));
});
document.getElementById('habitCancelBtn').addEventListener('click', () => closeModal('habitOverlay'));
document.getElementById('habitSaveBtn').addEventListener('click', saveHabit);
document.getElementById('habitDeleteBtn').addEventListener('click', () => {
  if (editingHabitIndex === null) return;
  habits.splice(editingHabitIndex, 1);
  storageSet('habits', JSON.stringify(habits));
  renderHabits();
  closeModal('habitOverlay');
});

function saveHabit() {
  const name = document.getElementById('habitNameInput').value.trim();
  if (!name) return;
  if (editingHabitIndex !== null) {
    habits[editingHabitIndex].name = name;
    habits[editingHabitIndex].icon = selectedEmoji;
  } else {
    habits.push({ name, icon: selectedEmoji, log: {} });
  }
  storageSet('habits', JSON.stringify(habits));
  renderHabits();
  closeModal('habitOverlay');
}

// ---------- Finance ----------
function monthLabel(y, m) {
  return new Date(y, m, 1).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
}
function txInMonth(t) {
  const d = new Date(t.date);
  return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
}
function updateMonthNav() {
  document.getElementById('monthLabel').textContent = monthLabel(viewYear, viewMonth);
}
document.getElementById('prevMonthBtn').addEventListener('click', () => {
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  updateMonthNav(); renderFinance();
});
document.getElementById('nextMonthBtn').addEventListener('click', () => {
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  updateMonthNav(); renderFinance();
});

function openTxModal(type, index = null) {
  currentTxType = type;
  editingTxIndex = index;
  const isEdit = index !== null;
  const tx = isEdit ? transactions[index] : null;
  if (isEdit) currentTxType = tx.type;

  document.getElementById('txModalTitle').textContent = isEdit ? 'Изменить операцию' : (currentTxType === 'income' ? 'Новый доход' : 'Новый расход');
  document.getElementById('txAmountInput').value = isEdit ? tx.amount : '';
  document.getElementById('txCatInput').value = '';
  selectedCat = isEdit ? tx.category : null;

  const chips = CATEGORIES[currentTxType];
  document.getElementById('txCatChips').innerHTML = chips.map(c =>
    `<div class="cat-chip ${selectedCat===c.n?'selected':''}" data-cat="${esc(c.n)}" data-icon="${esc(c.i)}">${c.i} ${esc(c.n)}</div>`
  ).join('');
  document.getElementById('txDeleteRow').style.display = isEdit ? 'flex' : 'none';
  document.getElementById('txOverlay').classList.add('active');
}
document.getElementById('addIncomeBtn').addEventListener('click', () => openTxModal('income'));
document.getElementById('addExpenseBtn').addEventListener('click', () => openTxModal('expense'));
document.getElementById('txCancelBtn').addEventListener('click', () => closeModal('txOverlay'));
document.getElementById('txCatChips').addEventListener('click', (e) => {
  const chip = e.target.closest('[data-cat]');
  if (!chip) return;
  selectedCat = chip.dataset.cat;
  document.getElementById('txCatInput').value = '';
  document.querySelectorAll('#txCatChips .cat-chip').forEach(c => c.classList.toggle('selected', c.dataset.cat === selectedCat));
});
document.getElementById('txSaveBtn').addEventListener('click', saveTx);
document.getElementById('txDeleteBtn').addEventListener('click', () => {
  if (editingTxIndex === null) return;
  transactions.splice(editingTxIndex, 1);
  storageSet('transactions', JSON.stringify(transactions));
  renderFinance();
  closeModal('txOverlay');
});

function catIcon(catName) {
  const all = [...CATEGORIES.income, ...CATEGORIES.expense];
  return all.find(c => c.n === catName)?.i || '📦';
}

function saveTx() {
  const amount = parseFloat(document.getElementById('txAmountInput').value);
  const customCat = document.getElementById('txCatInput').value.trim();
  const cat = customCat || selectedCat || (currentTxType === 'income' ? 'Доход' : 'Расход');
  if (!amount || amount <= 0) return;

  if (editingTxIndex !== null) {
    const tx = transactions[editingTxIndex];
    tx.amount = amount; tx.category = cat; tx.type = currentTxType;
  } else {
    transactions.unshift({ type: currentTxType, amount, category: cat, date: new Date().toISOString() });
  }
  storageSet('transactions', JSON.stringify(transactions));
  renderFinance();
  closeModal('txOverlay');
}

function renderFinance() {
  updateMonthNav();
  const monthTx = transactions.filter(txInMonth);
  const income = monthTx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
  const expense = monthTx.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
  document.getElementById('balanceAmount').textContent = formatMoney(income - expense);
  document.getElementById('totalIncome').textContent = '+' + formatMoney(income);
  document.getElementById('totalExpense').textContent = '-' + formatMoney(expense);

  // category breakdown (expenses only)
  const breakdownCard = document.getElementById('catBreakdownCard');
  const byCat = {};
  monthTx.filter(t => t.type === 'expense').forEach(t => { byCat[t.category] = (byCat[t.category]||0) + t.amount; });
  const catEntries = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
  if (catEntries.length === 0) {
    breakdownCard.style.display = 'none';
  } else {
    breakdownCard.style.display = 'block';
    document.getElementById('catBreakdown').innerHTML = catEntries.map(([name, sum]) => {
      const pct = expense ? Math.round(sum/expense*100) : 0;
      return `<div class="cat-row">
        <span>${catIcon(name)}</span>
        <span style="font-size:13px; min-width:80px;">${esc(name)}</span>
        <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%"></div></div>
        <span class="cat-pct">${pct}%</span>
      </div>`;
    }).join('');
  }

  const list = document.getElementById('txList');
  if (monthTx.length === 0) {
    list.innerHTML = '<div class="empty">Пока нет операций за этот месяц</div>';
    return;
  }
  const sorted = monthTx.map((t) => ({...t, _idx: transactions.indexOf(t)}));
  list.innerHTML = sorted.map(t => `
    <div class="tx-item" data-edit-tx="${t._idx}">
      <div class="tx-left">
        <div class="tx-icon">${catIcon(t.category)}</div>
        <div style="min-width:0">
          <div class="tx-cat">${esc(t.category)}</div>
          <div class="tx-date">${formatDate(t.date)}</div>
        </div>
      </div>
      <div class="tx-amount ${t.type === 'income' ? 'in' : 'out'}">${t.type === 'income' ? '+' : '-'}${formatMoney(t.amount)}</div>
    </div>
  `).join('');
}
document.getElementById('txList').addEventListener('click', (e) => {
  const item = e.target.closest('[data-edit-tx]');
  if (!item) return;
  const idx = +item.dataset.editTx;
  openTxModal(transactions[idx].type, idx);
});

function formatMoney(n) { return Math.round(n).toLocaleString('ru-RU') + ' ₽'; }
function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

// ---------- Modal helpers ----------
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', (e) => { if (e.target === o) o.classList.remove('active'); });
});
</script>
</body>
</html>
